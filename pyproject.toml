[project]
name = "dispute-agent"
version = "0.1.0"
description = "State-driven agent that resolves card-payment disputes with tools, a versioned policy KB, and evals"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.0",
    "duckdb>=1.1",
    "langgraph>=0.6",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "openai>=3.22.1",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "rank-bm25>=0.2.2",
]

[project.optional-dependencies]
# Days 8-9: fine-tuned transformer router
router = ["torch>=2.4", "transformers>=4.48", "accelerate>=1.1", "datasets>=3.0", "scikit-learn>=1.5"]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
dispute-agent = "dispute_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dispute_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
